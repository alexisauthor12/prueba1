name: Compilar APK

# Ruta B: el APK se compila en la nube, sin instalar nada en tu PC.
# Se dispara al hacer push, o a mano desde la pestana "Actions" -> "Run workflow".

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    name: Generar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generar el Gradle wrapper (para poder compilar tambien en local)
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Compilar APK de depuracion
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Compilar APK de release (sin firmar)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publicar APK de depuracion
        uses: actions/upload-artifact@v4
        with:
          name: bdv-inicio-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK de release sin firmar
        uses: actions/upload-artifact@v4
        with:
          name: bdv-inicio-release-sin-firmar-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Resumen
        run: |
          echo "## APK generados" >> $GITHUB_STEP_SUMMARY
          find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; >> $GITHUB_STEP_SUMMARY

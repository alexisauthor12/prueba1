<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BDV - Flujo: Inicio &rarr; Autenticación &rarr; Contraseña &rarr; Dashboard &rarr; Pagos &rarr; PagomóvilBDV &rarr; Comprobante</title>
<style>
  html,body{margin:0;height:100%;background:#101010;overflow:hidden;
            display:flex;align-items:center;justify-content:center;}
  #marco{position:relative;width:720px;height:1460px;flex:0 0 auto;
         transform-origin:center center;
         box-shadow:0 0 0 10px #1b1b1b,0 0 0 11px #2e2e2e,0 30px 90px rgba(0,0,0,.85);
         border-radius:6px;overflow:hidden;background:#303030;}
  #marco iframe{width:720px;height:1460px;border:0;display:block;}
  .zona{position:absolute;cursor:pointer;border-radius:8px;display:none;}
  .zona:hover{background:rgba(255,255,255,.06);}
  /* Pantalla de inicio */
  #zonaBoton{left:90px;top:632px;width:540px;height:80px;border-radius:20px;}
  /* Pantalla de autenticación */
  #zonaIngresa{left:170px;top:848px;width:380px;height:56px;}
  #zonaVolver{left:190px;top:1372px;width:350px;height:70px;}
  /* Los botones Aceptar/Cancelar NO llevan zona: los pulsa el propio diálogo
     (que valida la contraseña) y avisa al visor con postMessage. */
  #zonaVeloArriba{left:0;top:0;width:720px;height:524px;border-radius:0;}
  #zonaVeloAbajo{left:0;top:938px;width:720px;height:518px;border-radius:0;}
  #zonaVeloIzq{left:0;top:524px;width:80px;height:414px;border-radius:0;}
  #zonaVeloDer{left:640px;top:524px;width:80px;height:414px;border-radius:0;}
  /* Dashboard: la barra inferior vuelve al inicio de sesión.
     La columna "Pagos" (x 240..360) abre el panel de Pagos. */
  #zonaDashVolver{left:0;top:1346px;width:720px;height:104px;border-radius:0;}
  #zonaDashPagos{left:240px;top:1346px;width:120px;height:104px;border-radius:0;}
  /* Panel de Pagos: el velo de arriba y cada opción cierran el panel */
  #zonaPagosVelo{left:0;top:0;width:720px;height:803px;border-radius:0;}
  #zonaPago1{left:0;top:887px;width:720px;height:112px;border-radius:0;}
  #zonaPago2{left:0;top:999px;width:720px;height:112px;border-radius:0;}
  #zonaPago3{left:0;top:1111px;width:720px;height:112px;border-radius:0;}
  #zonaPago4{left:0;top:1223px;width:720px;height:112px;border-radius:0;}
  #zonaPago5{left:0;top:1335px;width:720px;height:111px;border-radius:0;}
  /* PagomóvilBDV: "Inicio" en la barra inferior vuelve al dashboard */
  #zonaPmNavInicio{left:0;top:1345px;width:120px;height:106px;border-radius:0;}
  /* Comprobante de operacion: las dos flechas lo cierran */
  #zonaCpAtras{left:25px;top:28px;width:48px;height:47px;border-radius:0;}
  #zonaCpCerrar{left:288px;top:1011px;width:58px;height:56px;border-radius:0;}
  #etiqueta{position:fixed;left:14px;top:12px;color:#9a9a9a;font:13px Arial,Helvetica,sans-serif;}
  #aviso{position:fixed;left:14px;bottom:12px;color:#6f6f6f;font:12px Arial,Helvetica,sans-serif;}
</style>
</head>
<body>
<div id="marco">
  <iframe id="vista" src="index.html" scrolling="no"></iframe>

  <div id="zonaBoton" class="zona" title="Iniciar sesión" style="display:block"></div>

  <div id="zonaIngresa" class="zona" title="Ingresa con tu contraseña"></div>
  <div id="zonaVolver"  class="zona" title="Desvincular dispositivo"></div>

  <div id="zonaVeloArriba" class="zona" title="Cerrar"></div>
  <div id="zonaVeloAbajo"  class="zona" title="Cerrar"></div>
  <div id="zonaVeloIzq"    class="zona" title="Cerrar"></div>
  <div id="zonaVeloDer"    class="zona" title="Cerrar"></div>

  <div id="zonaDashVolver" class="zona" title="Volver al inicio de sesión"></div>
  <div id="zonaDashPagos"  class="zona" title="Abrir el panel de Pagos"></div>

  <div id="zonaPagosVelo" class="zona" title="Cerrar el panel"></div>
  <div id="zonaPago1" class="zona" title="PagomóvilBDV"></div>
  <div id="zonaPago2" class="zona" title="PagomóvilBDV QR"></div>
  <div id="zonaPago3" class="zona" title="Tarjeta de crédito"></div>
  <div id="zonaPago4" class="zona" title="Financiamiento especial"></div>
  <div id="zonaPago5" class="zona" title="Pagos compartidos"></div>

  <div id="zonaPmNavInicio" class="zona" title="Volver al dashboard"></div>

  <div id="zonaCpAtras"  class="zona" title="Volver a PagomóvilBDV"></div>
  <div id="zonaCpCerrar" class="zona" title="Volver a PagomóvilBDV"></div>
</div>

<div id="etiqueta">1 / 7 &nbsp;·&nbsp; Pantalla de inicio</div>
<div id="aviso">Haz clic en "Iniciar sesión" para ver el flujo de autenticación</div>

<script>
  var marco = document.getElementById('marco');
  var v     = document.getElementById('vista');
  var et    = document.getElementById('etiqueta');
  var av    = document.getElementById('aviso');
  var zonas = ['zonaBoton','zonaIngresa','zonaVolver','zonaVeloArriba','zonaVeloAbajo',
               'zonaVeloIzq','zonaVeloDer','zonaDashVolver','zonaDashPagos',
               'zonaPagosVelo','zonaPago1','zonaPago2','zonaPago3','zonaPago4','zonaPago5',
               'zonaPmNavInicio','zonaCpAtras','zonaCpCerrar'];

  function mostrar(ids, alto, ancho){
    for(var i=0;i<zonas.length;i++){
      document.getElementById(zonas[i]).style.display = 'none';
    }
    for(var j=0;j<ids.length;j++){
      document.getElementById(ids[j]).style.display = 'block';
    }
    /* Cada pantalla tiene su propio lienzo: las del flujo 720 px y el
       comprobante 633 px (su mockup viene a otra escala). */
    var w = ancho || 720;
    marco.style.width  = w + 'px';
    marco.style.height = alto + 'px';
    marco.style.background = (w === 633) ? '#212121' : '#303030';
    v.style.width  = w + 'px';
    v.style.height = alto + 'px';
    ajustar();
  }

  function irAlInicio(){
    v.src = 'index.html';
    mostrar(['zonaBoton'], 1460);
    et.textContent = '1 / 7  ·  Pantalla de inicio';
    av.textContent = 'Haz clic en "Iniciar sesión" para ver el flujo de autenticación';
  }
  function irAlLogin(){
    v.src = 'login.html';
    mostrar(['zonaIngresa','zonaVolver'], 1460);
    et.textContent = '2 / 7  ·  Pantalla de autenticación';
    av.textContent = 'Haz clic en "Ingresa con tu contraseña" para abrir el diálogo';
  }
  function irAlClave(){
    v.src = 'clave.html';
    mostrar(['zonaVelo','zonaAceptar','zonaCancelar'], 1456);
    et.textContent = '3 / 7  ·  Diálogo "Ingresa con tu contraseña"';
    av.textContent = 'Escribe 12345 en el campo y pulsa "Aceptar" para entrar al dashboard';
  }
  function irAlDashboard(){
    v.src = 'dashboard.html';
    mostrar(['zonaDashVolver','zonaDashPagos'], 1450);
    et.textContent = '4 / 7  ·  Dashboard (con la contraseña 12345)';
    av.textContent = 'Haz clic en "Pagos" (barra inferior) para abrir el panel';
  }
  function irAlPagos(){
    v.src = 'pagos.html';
    mostrar(['zonaPagosVelo','zonaPago1','zonaPago2','zonaPago3','zonaPago4','zonaPago5'], 1446);
    et.textContent = '5 / 7  ·  Panel de Pagos';
    av.textContent = 'Haz clic en "PagomóvilBDV" para abrir su pantalla (o en el velo para cerrar)';
  }
  function irAlPagomovil(){
    v.src = 'pagomovil.html';
    mostrar(['zonaPmNavInicio'], 1451);
    et.textContent = '6 / 7  ·  PagomóvilBDV';
    av.textContent = 'Escribe los datos en los campos y pulsa "Pagar" para ver el comprobante';
  }
  /* El comprobante recibe los datos que se escribieron en PagomovilBDV
     (por postMessage, porque la pantalla va dentro de un iframe). */
  function irAlComprobante(datos){
    v.onload = function(){
      v.onload = null;
      if(datos){ v.contentWindow.postMessage({tipo:'bdv-datos', datos:datos}, '*'); }
    };
    v.src = 'comprobante.html';
    /* 633 x 1280 px: el lienzo del comprobante, mas estrecho que el resto */
    mostrar(['zonaCpAtras','zonaCpCerrar'], 1280, 633);
    et.textContent = '7 / 7  ·  Comprobante de operación';
    av.textContent = 'Haz clic en cualquiera de las flechas para volver a PagomóvilBDV';
  }

  document.getElementById('zonaBoton').addEventListener('click', irAlLogin);
  document.getElementById('zonaIngresa').addEventListener('click', irAlClave);
  document.getElementById('zonaVolver').addEventListener('click', irAlInicio);
  document.getElementById('zonaVeloArriba').addEventListener('click', irAlLogin);
  document.getElementById('zonaVeloAbajo').addEventListener('click', irAlLogin);
  document.getElementById('zonaVeloIzq').addEventListener('click', irAlLogin);
  document.getElementById('zonaVeloDer').addEventListener('click', irAlLogin);
  document.getElementById('zonaDashVolver').addEventListener('click', irAlLogin);
  document.getElementById('zonaDashPagos').addEventListener('click', irAlPagos);

  document.getElementById('zonaPagosVelo').addEventListener('click', irAlDashboard);
  document.getElementById('zonaPago1').addEventListener('click', irAlPagomovil);
  document.getElementById('zonaPago2').addEventListener('click', irAlDashboard);
  document.getElementById('zonaPago3').addEventListener('click', irAlDashboard);
  document.getElementById('zonaPago4').addEventListener('click', irAlDashboard);
  document.getElementById('zonaPago5').addEventListener('click', irAlDashboard);
  document.getElementById('zonaPmNavInicio').addEventListener('click', irAlDashboard);
  document.getElementById('zonaCpAtras').addEventListener('click', irAlPagomovil);
  document.getElementById('zonaCpCerrar').addEventListener('click', irAlPagomovil);

  /* El diálogo valida la contraseña por dentro (Aceptar, Enter o Cancelar) y
     avisa con postMessage: aquí solo se cambia de pantalla. */
  window.addEventListener('message', function(ev){
    var d = ev.data;
    if(d === 'bdv-dashboard'){ irAlDashboard(); }
    else if(d === 'bdv-login'){ irAlLogin(); }
    /* PagomovilBDV manda los datos al pulsar Pagar */
    else if(d && d.tipo === 'bdv-pagar'){ irAlComprobante(d.datos); }
    /* Las flechas del comprobante vuelven a PagomovilBDV */
    else if(d && d.tipo === 'bdv-volver'){ irAlPagomovil(); }
  });

  function ajustar(){
    var alto  = parseFloat(marco.style.height) || 1460;
    var ancho = parseFloat(marco.style.width)  || 720;
    var s = Math.min(window.innerWidth / ancho, window.innerHeight / alto) * 0.92;
    marco.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', ajustar);
  window.addEventListener('load', ajustar);
  ajustar();
</script>
</body>
</html>

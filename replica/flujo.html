<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BDV - Flujo: Inicio &rarr; Autenticación &rarr; Contraseña</title>
<style>
  html,body{margin:0;height:100%;background:#101010;overflow:hidden;
            display:flex;align-items:center;justify-content:center;}
  #marco{position:relative;width:720px;height:1460px;flex:0 0 auto;
         transform-origin:center center;
         box-shadow:0 0 0 10px #1b1b1b,0 0 0 11px #2e2e2e,0 30px 90px rgba(0,0,0,.85);
         border-radius:6px;overflow:hidden;background:#303030;}
  #marco iframe{width:720px;height:1460px;border:0;display:block;}
  .zona{position:absolute;cursor:pointer;border-radius:8px;display:none;}
  .zona:hover{background:rgba(255,255,255,.06);}
  /* Pantalla de inicio */
  #zonaBoton{left:90px;top:632px;width:540px;height:80px;border-radius:20px;}
  /* Pantalla de autenticación */
  #zonaIngresa{left:170px;top:848px;width:380px;height:56px;}
  #zonaVolver{left:190px;top:1372px;width:350px;height:70px;}
  /* Los botones Aceptar/Cancelar NO llevan zona: los pulsa el propio diálogo
     (que valida la contraseña) y avisa al visor con postMessage. */
  #zonaVeloArriba{left:0;top:0;width:720px;height:524px;border-radius:0;}
  #zonaVeloAbajo{left:0;top:938px;width:720px;height:518px;border-radius:0;}
  #zonaVeloIzq{left:0;top:524px;width:80px;height:414px;border-radius:0;}
  #zonaVeloDer{left:640px;top:524px;width:80px;height:414px;border-radius:0;}
  /* Dashboard: la barra inferior vuelve al inicio de sesión */
  #zonaDashVolver{left:0;top:1346px;width:720px;height:104px;border-radius:0;}
  #etiqueta{position:fixed;left:14px;top:12px;color:#9a9a9a;font:13px Arial,Helvetica,sans-serif;}
  #aviso{position:fixed;left:14px;bottom:12px;color:#6f6f6f;font:12px Arial,Helvetica,sans-serif;}
</style>
</head>
<body>
<div id="marco">
  <iframe id="vista" src="index.html" scrolling="no"></iframe>

  <div id="zonaBoton" class="zona" title="Iniciar sesión" style="display:block"></div>

  <div id="zonaIngresa" class="zona" title="Ingresa con tu contraseña"></div>
  <div id="zonaVolver"  class="zona" title="Desvincular dispositivo"></div>

  <div id="zonaVeloArriba" class="zona" title="Cerrar"></div>
  <div id="zonaVeloAbajo"  class="zona" title="Cerrar"></div>
  <div id="zonaVeloIzq"    class="zona" title="Cerrar"></div>
  <div id="zonaVeloDer"    class="zona" title="Cerrar"></div>

  <div id="zonaDashVolver" class="zona" title="Volver al inicio de sesión"></div>
</div>

<div id="etiqueta">1 / 4 &nbsp;·&nbsp; Pantalla de inicio</div>
<div id="aviso">Haz clic en "Iniciar sesión" para ver el flujo de autenticación</div>

<script>
  var marco = document.getElementById('marco');
  var v     = document.getElementById('vista');
  var et    = document.getElementById('etiqueta');
  var av    = document.getElementById('aviso');
  var zonas = ['zonaBoton','zonaIngresa','zonaVolver','zonaVeloArriba','zonaVeloAbajo',
               'zonaVeloIzq','zonaVeloDer','zonaDashVolver'];

  function mostrar(ids, alto){
    for(var i=0;i<zonas.length;i++){
      document.getElementById(zonas[i]).style.display = 'none';
    }
    for(var j=0;j<ids.length;j++){
      document.getElementById(ids[j]).style.display = 'block';
    }
    marco.style.height = alto + 'px';
    v.style.height = alto + 'px';
    ajustar();
  }

  function irAlInicio(){
    v.src = 'index.html';
    mostrar(['zonaBoton'], 1460);
    et.textContent = '1 / 4  ·  Pantalla de inicio';
    av.textContent = 'Haz clic en "Iniciar sesión" para ver el flujo de autenticación';
  }
  function irAlLogin(){
    v.src = 'login.html';
    mostrar(['zonaIngresa','zonaVolver'], 1460);
    et.textContent = '2 / 4  ·  Pantalla de autenticación';
    av.textContent = 'Haz clic en "Ingresa con tu contraseña" para abrir el diálogo';
  }
  function irAlClave(){
    v.src = 'clave.html';
    mostrar(['zonaVelo','zonaAceptar','zonaCancelar'], 1456);
    et.textContent = '3 / 4  ·  Diálogo "Ingresa con tu contraseña"';
    av.textContent = 'Escribe 12345 en el campo y pulsa "Aceptar" para entrar al dashboard';
  }
  function irAlDashboard(){
    v.src = 'dashboard.html';
    mostrar(['zonaDashVolver'], 1450);
    et.textContent = '4 / 4  ·  Dashboard (con la contraseña 12345)';
    av.textContent = 'Haz clic en la barra inferior para volver al inicio de sesión';
  }

  document.getElementById('zonaBoton').addEventListener('click', irAlLogin);
  document.getElementById('zonaIngresa').addEventListener('click', irAlClave);
  document.getElementById('zonaVolver').addEventListener('click', irAlInicio);
  document.getElementById('zonaVeloArriba').addEventListener('click', irAlLogin);
  document.getElementById('zonaVeloAbajo').addEventListener('click', irAlLogin);
  document.getElementById('zonaVeloIzq').addEventListener('click', irAlLogin);
  document.getElementById('zonaVeloDer').addEventListener('click', irAlLogin);
  document.getElementById('zonaDashVolver').addEventListener('click', irAlLogin);

  /* El diálogo valida la contraseña por dentro (Aceptar, Enter o Cancelar) y
     avisa con postMessage: aquí solo se cambia de pantalla. */
  window.addEventListener('message', function(ev){
    if(ev.data === 'bdv-dashboard'){ irAlDashboard(); }
    else if(ev.data === 'bdv-login'){ irAlLogin(); }
  });

  function ajustar(){
    var alto = parseFloat(marco.style.height) || 1460;
    var s = Math.min(window.innerWidth / 720, window.innerHeight / alto) * 0.92;
    marco.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', ajustar);
  window.addEventListener('load', ajustar);
  ajustar();
</script>
</body>
</html>

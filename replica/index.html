<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BDV · Pantalla de inicio — réplica 1:1 (720×1453 px @2x)</title>
<style>
  /* La misma fuente que lleva el APK (Arimo, metrica compatible con Arial) */
  @font-face{
    font-family:'Nunito';
    src:url('nunito.ttf') format('truetype');
    font-weight:400 700;
    font-style:normal;
  }
  html,body{margin:0;padding:0;background:#303030;}
  body{position:relative;width:720px;height:1453px;overflow:hidden;
       font-family:'Nunito',Arial,Helvetica,sans-serif;
       -webkit-font-smoothing:antialiased;}
  .el{position:absolute;}
  .txt{left:0;width:720px;text-align:center;line-height:1;white-space:nowrap;}

  /* franjas diagonales (fondo, detrás de todo) */
  #franjas{left:0;top:0;width:720px;height:1453px;}

  /* campana + badge de notificaciones */
  #campana{left:31px;top:22px;width:54px;height:54px;}
  #badge{left:56px;top:19px;width:32px;height:32px;border-radius:16px;background:#A32C24;}
  #badge3{left:56px;top:25.65px;width:32px;text-align:center;line-height:1;
          font-size:18px;font-weight:600;color:#FFFFFF;}

  /* logotipo de marca */
  #logo{left:100px;top:325px;width:516px;height:182px;}

  /* subtítulo */
  #subtitulo{top:522.7px;font-size:48px;font-weight:400;color:#FFFFFF;}

  /* botón */
  #boton{left:90px;top:632px;width:540px;height:80px;border-radius:20px;background:#BB1B47;}
  #botonTxt{top:662.1px;font-size:22px;font-weight:700;color:#FFFFFF;}

  /* enlace */
  #enlace{top:793.6px;font-size:26px;font-weight:400;color:#A42749;
          letter-spacing:-1.03px;}

  /* tarjetas */
  .tarjeta{top:882px;width:112px;height:112px;border-radius:24px;background:#BB1B47;}
  #t1{left:79px;} #t2{left:304px;} #t3{left:529px;}
  .ic{position:absolute;}
  #ic1{left:35px;top:25px;width:42px;height:62px;}
  #ic2{left:24px;top:24px;width:63px;height:63px;}
  #ic3{left:30px;top:30px;width:55px;height:52px;}

  /* etiquetas */
  .lab{width:240px;text-align:center;font-size:20px;line-height:28px;
       color:#FFFFFF;white-space:nowrap;}
  #lab1{left:14.5px;top:1013.4px;}
  #lab2{left:239.5px;top:1013.4px;}
  #lab3{left:464.5px;top:1013.4px;}

  /* recorte negro inferior del mockup */
  #barraInferior{left:0;top:1447px;width:720px;height:6px;background:#000000;}
</style>
</head>
<body>

<svg id="franjas" class="el" viewBox="0 0 720 1453" xmlns="http://www.w3.org/2000/svg">
  <polygon points="0,1043.7 357,1220 161,1317 0,1249" fill="#FDC800"/>
  <polygon points="720,1044 0,1396 0,1453 293,1453 720,1250" fill="#0068B1"/>
  <polygon points="720,1250 720,1453 293,1453" fill="#BB1B47"/>
</svg>

<div id="barraInferior" class="el"></div>

<svg id="campana" class="el" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <path fill="#FFFFFF" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
</svg>

<div id="badge" class="el"></div>
<div id="badge3" class="el">3</div>

<img id="logo" class="el" src="logo-bdv.png" alt="BDV · Banco de Venezuela">

<div id="subtitulo" class="el txt">Banco de Venezuela</div>

<div id="boton" class="el"></div>
<div id="botonTxt" class="el txt">Iniciar sesión</div>

<div id="enlace" class="el txt">Quiero abrir una cuenta en el BDV</div>

<div id="t1" class="el tarjeta"><img class="ic" id="ic1" src="ico-movil.png" alt=""></div>
<div id="t2" class="el tarjeta"><img class="ic" id="ic2" src="ico-access.png" alt=""></div>
<div id="t3" class="el tarjeta"><img class="ic" id="ic3" src="ico-saldos.png" alt=""></div>

<div id="lab1" class="el lab">PagomóvilBDV</div>
<div id="lab2" class="el lab">Pagos<br>AccessPay</div>
<div id="lab3" class="el lab">Ver mis<br>saldos</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BDV - Dialogo de contrasena (replica 1:1, 720x1456 px @2x)</title>
<style>
  @font-face{
    font-family:'Nunito';
    src:url('nunito.ttf') format('truetype');
    font-weight:200 1000;
    font-style:normal;
  }
  html,body{margin:0;padding:0;background:#303030;}
  body{position:relative;width:720px;height:1456px;overflow:hidden;
       font-family:'Nunito',Arial,Helvetica,sans-serif;font-weight:500;
       -webkit-font-smoothing:antialiased;}

  /* Fondo: la pantalla de login. Este mockup tiene 4 px menos arriba. */
  #fondo{position:absolute;left:0;top:-4px;width:720px;height:1460px;border:0;}

  /* Velo negro al 53 % (medido sobre el mockup) */
  #velo{position:absolute;left:0;top:0;width:720px;height:1456px;
        background:rgba(0,0,0,0.53);}

  /* Tarjeta del dialogo: 560x414 en (80, 524), radio 20 px */
  #dialogo{position:absolute;left:80px;top:524px;width:560px;height:414px;
           border-radius:20px;background:#424242;}

  .el{position:absolute;}
  .txt{left:0;width:560px;text-align:center;line-height:1;white-space:nowrap;}

  /* "Usuario: A*****4" - 28 px, blanco */
  #usuario{top:52.9px;font-size:28px;color:#FFFFFF;}

  /* Campo de contrasena: 480x96 en (40, 150), radio 20, borde 4 px */
  #campo{position:absolute;left:40px;top:150px;width:480px;height:96px;box-sizing:border-box;
         border-radius:20px;border:4px solid #9E9E9E;background:#555555;}

  /* Campo de texto real, para poder escribir en la vista previa.
     El texto queda centrado verticalmente, como en el mockup. */
  #clave{position:absolute;left:17px;top:4px;width:400px;height:88px;
         box-sizing:border-box;margin:0;padding:0;border:0;outline:none;
         background:transparent;font-family:inherit;font-size:27px;
         color:#FFFFFF;letter-spacing:-0.011em;}
  #clave::placeholder{color:#757575;opacity:1;}

  /* Ojo para mostrar/ocultar (descontado el borde de 4 px del campo) */
  #ojo{left:400px;top:23px;width:56px;height:42px;}

  /* Botones: 176x80, radio 20, #BB1B47 */
  .boton{top:294px;width:176px;height:80px;border-radius:20px;background:#BB1B47;
         display:flex;align-items:center;justify-content:center;
         color:#FFFFFF;font-size:25px;font-weight:550;line-height:1;
         letter-spacing:-0.025em;}
  #btnAceptar{left:94px;}
  #btnCancelar{left:290px;}
</style>
</head>
<body>
  <iframe id="fondo" src="login.html" scrolling="no"></iframe>
  <div id="velo"></div>

  <div id="dialogo">
    <div id="usuario" class="el txt">Usuario: A*****4</div>

    <div id="campo">
      <input id="clave" type="password" placeholder="Contraseña:"
             autocomplete="off" spellcheck="false">
      <img id="ojo" class="el" src="ico-ojo.png" alt="Mostrar contraseña">
    </div>

    <div id="btnAceptar" class="el boton">Aceptar</div>
    <div id="btnCancelar" class="el boton">Cancelar</div>
  </div>
  <script>
    // --- Dialogo funcional: escribir la contrasena y entrar al dashboard ---
    var campo = document.getElementById('clave');
    var ojo   = document.getElementById('ojo');

    // El ojo muestra u oculta la contrasena
    ojo.addEventListener('click', function(){
      campo.type = (campo.type === 'password') ? 'text' : 'password';
    });

    // Al pulsar Aceptar (o Enter) se comprueba la contrasena
    function entrar(){
      if(campo.value === '12345'){
        // Avisa al visor flujo.html (si estamos dentro de el)...
        try {
          if(window.parent !== window){ window.parent.postMessage('bdv-dashboard', '*'); }
        } catch(e){}
        // ...y ademas navega el propio marco, que funciona en los dos casos
        window.location.href = 'dashboard.html';
      } else {
        campo.value = '';
        alert('Contraseña incorrecta.\n\nLa contraseña de la demo es 12345');
        campo.focus();
      }
    }

    document.getElementById('btnAceptar').addEventListener('click', entrar);
    document.getElementById('btnCancelar').addEventListener('click', function(){
      campo.value = '';
      if(window.parent !== window){ window.parent.postMessage('bdv-login', '*'); }
    });
    campo.addEventListener('keydown', function(ev){
      if(ev.key === 'Enter'){ entrar(); }
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=633">
<title>BDV - Comprobante de operación (replica 1:1, 633x1280 px)</title>
<style>
  /* Nunito: es la tipografia de marca del banco (la web oficial usa
     "font-family: Nunito, sans-serif") y la unica de las 13 probadas que baja
     la diferencia de los textos. Licencia SIL OFL 1.1 (se puede incrustar).
     Se ajusta cada texto con su propio interletra: Nunito es mas estrecha que
     Arial y, sin compensar, el ancho se desviaba 4-16 px. */
  @font-face{
    font-family:'Nunito';
    src:url('nunito.ttf') format('truetype');
    font-weight:200 1000;
    font-style:normal;
  }
  html,body{margin:0;padding:0;background:#212121;}
  body{position:relative;width:633px;height:1280px;overflow:hidden;
       font-family:'Nunito',Arial,Helvetica,sans-serif;
       -webkit-font-smoothing:antialiased;}

  /* ---- Barra superior: atras (33,36), titulo centrado, compartir ----
     Todos los textos llevan capa de composicion (translateZ(0)): asi Chrome
     usa antialiasing en escala de grises, como el telefono que hizo el mockup,
     en vez de meterle flecos naranjas y azules (subpixel). Medido, el diff
     global baja de 5,56 a 4,80 y cada texto entre un 10 % y un 20 %. */
  #cpFlecha{position:absolute;left:33px;top:36px;width:32px;height:32px;}
  /* Titulo: Nunito 650, medido contra el mockup (trazo 4,57 px frente a 4,66).
     El interletra (0,45 px a 28 px) es el que menos diferencia deja de 0,35 a
     0,8 px probados. El mockup lo lleva 8,5 px a la izquierda del centro (tinta
     de x126 a x490, margenes 126 y 143: como si el texto llevase espacios de
     mas al final). */
  #cpTitulo{transform:translateZ(0);position:absolute;left:-8.5px;top:40.1px;width:633px;text-align:center;
            font-size:28px;font-weight:700;letter-spacing:0.45px;color:#FFFFFF;line-height:1;white-space:nowrap;}
  #cpCompartir{position:absolute;left:572px;top:31px;width:38px;height:40px;}

  /* ---- Centro: logo, subtitulo, check y caja del monto ---- */
  #cpLogo{position:absolute;left:269px;top:147px;width:90px;height:96px;}
  /* Subtitulo: interletra medido (probados -0,4 / -0,137 / +0,1 px; el +0,1 es el
     que menos diferencia deja, 10,5 frente a 22,6 y 10,7). */
  /* Subtitulo: Nunito 500 (antes 400). El mockup es un JPEG y el desenfoque
     engorda la letra, asi que a 400 se veia mas fina que la referencia. */
  #cpSubtitulo{transform:translateZ(0);position:absolute;left:0;top:257.3px;width:633px;text-align:center;
               font-size:24.5px;font-weight:500;letter-spacing:0.1px;color:#FFFFFF;line-height:1;white-space:nowrap;}
  #cpCheck{position:absolute;left:291px;top:296px;width:50px;height:49px;z-index:2;}
  #cpCaja{position:absolute;left:45px;top:365px;width:543px;height:69px;
          border-radius:17px;background:#757575;}
  /* El monto es un blanco suave (#F5F5F5), no blanco puro: el mockup es JPEG y
     su texto llega suavizado. Medido, es el valor que menos se desvia
     (diff 10,22 frente a 13,97 con #FFFFFF).
     Con Nunito (la fuente de marca) y peso 500 el monto baja a 5,77: es el
     texto que mas gana con la tipografia correcta. */
  /* Monto: Nunito 600 (se probo el 650, "un pelo mas grueso", y se dejo el 600,
     que es el punto que mejor queda). Medido con renders de verdad: 500 -> 5,77 ·
     600 -> 5,90 · 650 -> 7,04 · 700 -> 8,62. El tamano no se toca: la tinta mide
     132x21 px en el mockup y en la replica. */
  #cpMonto{transform:translateZ(0);position:absolute;left:0;top:387.3px;width:633px;text-align:center;
           font-size:25px;font-weight:600;letter-spacing:-0.35px;color:#F5F5F5;line-height:1;white-space:nowrap;}

  /* ---- Filas: etiqueta (izq, negrita) y valor (der) ----
     El icono de copiar va AL LADO del numero, no encima: el numero de la
     operacion termina en x 540 y el icono ocupa 555..582 (28x34). */
  .cpEtiqueta{transform:translateZ(0);position:absolute;left:57px;font-size:22px;font-weight:700;
              letter-spacing:-1px;color:#FFFFFF;line-height:1;white-space:nowrap;}
  .cpValor{transform:translateZ(0);position:absolute;right:58px;font-size:22px;letter-spacing:-0.6px;
           color:#FFFFFF;line-height:1;white-space:nowrap;text-align:right;}
  #cpCopiar{position:absolute;left:555px;top:508px;width:28px;height:34px;cursor:pointer;}

  /* ---- Pie: flecha, separador y los dos interruptores ---- */
  #cpFlechaPie{position:absolute;left:296px;top:1021px;width:40px;height:39px;}
  #cpSeparador{position:absolute;left:0;top:1096px;width:633px;height:6px;background:#272727;}
  /* Interruptores: medidos en el mockup. El riel mide 64x36 px (radio 18) y la
     bola 34,5 px (radio 17,25), con la bola 1 px por debajo del borde del riel y
     los dos compartiendo la base. Antes eran 63x35 y 32: 2-3 px mas pequeños, y
     en el movil se notaba. Colores medidos: riel #636363 y bola #BDBDBD. */
  .cpTrack{position:absolute;left:186px;width:64px;height:36px;border-radius:18px;background:#636363;}
  .cpKnob{position:absolute;left:187px;width:34.5px;height:34.5px;border-radius:17.25px;background:#BDBDBD;}
  .cpEtiquetaInt{transform:translateZ(0);position:absolute;left:273px;font-size:21px;font-weight:500;
                 letter-spacing:-0.1px;color:#FFFFFF;line-height:1;white-space:nowrap;}
</style>
</head>
<body>

  <img id="cpFlecha" src="cp_flecha.png" alt="">
  <div id="cpTitulo">Comprobante de operación</div>
  <img id="cpCompartir" src="cp_compartir.png" alt="">

  <img id="cpLogo" src="cp_logo.png" alt="">
  <div id="cpSubtitulo">PagomóvilBDV Personas</div>
  <img id="cpCheck" src="cp_check.png" alt="">
  <div id="cpCaja"></div>
  <div id="cpMonto">2.400,00 Bs</div>

  <!-- Filas: cap-top medidos [466, 515, 565, 615, 664, 713, 763] -->
  <div class="cpEtiqueta" style="top:463.6px">Fecha:</div>
  <div class="cpValor" id="cpVal1" style="top:463.6px">13/10/2026</div>

  <div class="cpEtiqueta" style="top:512.6px">Operación:</div>
  <!-- El numero termina en x 540 (no en 575 como los demas valores) para
       dejarle sitio al icono de copiar, que va a su lado (555..582). -->
  <div class="cpValor" id="cpVal2" style="top:512.6px;right:93px">007652036202</div>
  <img id="cpCopiar" src="cp_copiar.png" alt="Copiar el número de operación">

  <div class="cpEtiqueta" style="top:562.6px">Identificación:</div>
  <div class="cpValor" id="cpVal3" style="top:562.6px">24349893</div>

  <div class="cpEtiqueta" style="top:612.6px">Origen:</div>
  <div class="cpValor" id="cpVal4" style="top:612.6px">0102****5124</div>

  <div class="cpEtiqueta" style="top:661.6px">Destino:</div>
  <div class="cpValor" id="cpVal5" style="top:661.6px">04147459612</div>

  <div class="cpEtiqueta" style="top:710.6px">Banco:</div>
  <div class="cpValor" id="cpVal6" style="top:710.6px">0105 - BANCO MERCANTIL</div>

  <div class="cpEtiqueta" style="top:760.6px">Concepto:</div>
  <div class="cpValor" id="cpVal7" style="top:760.6px">pago</div>

  <!-- Pie -->
  <img id="cpFlechaPie" src="cp_flecha_pie.png" alt="">
  <div id="cpSeparador"></div>

  <div class="cpTrack" id="cpTrack1" style="top:1135px"></div>
  <div class="cpKnob"  id="cpKnob1"  style="top:1136px"></div>
  <div class="cpEtiquetaInt" style="top:1142.7px">Agregar Beneficiario</div>

  <div class="cpTrack" id="cpTrack2" style="top:1220px"></div>
  <div class="cpKnob"  id="cpKnob2"  style="top:1221px"></div>
  <div class="cpEtiquetaInt" style="top:1227.7px">Crear Acceso directo</div>

  <script>
    /* El comprobante se puede abrir de tres formas:
       1) solo (comprobante.html)          -> datos del mockup, tal cual.
       2) con parametros (comprobante.html?documento=...&telefono=...&monto=...)
          -> los datos que se escribieron en PagomovilBDV.
       3) dentro del visor de flujo: el visor manda los datos por postMessage. */
    function dosDigitos(n){ return (n < 10 ? '0' : '') + n; }

    function pintar(d){
      if(d.documento){ document.getElementById('cpVal3').textContent = d.documento; }
      if(d.telefono){  document.getElementById('cpVal5').textContent = d.telefono; }
      if(d.monto){     document.getElementById('cpMonto').textContent = d.monto; }
      if(d.concepto){  document.getElementById('cpVal7').textContent = d.concepto; }
      if(d.banco){     document.getElementById('cpVal6').textContent = d.banco; }
      /* Fecha de hoy y numero de operacion (12 digitos, empieza por 00) */
      var h = new Date();
      document.getElementById('cpVal1').textContent =
        dosDigitos(h.getDate()) + '/' + dosDigitos(h.getMonth() + 1) + '/' + h.getFullYear();
      document.getElementById('cpVal2').textContent =
        '00' + (1000000000 + Math.floor(Math.random() * 9000000000));
    }

    var q = new URLSearchParams(location.search);
    if(q.get('documento') || q.get('telefono') || q.get('monto')){
      pintar({documento: q.get('documento'), telefono: q.get('telefono'), monto: q.get('monto'),
              concepto: q.get('concepto'), banco: q.get('banco')});
    }

    window.addEventListener('message', function(ev){
      if(ev.data && ev.data.tipo === 'bdv-datos'){ pintar(ev.data.datos); }
    });

    /* Las dos flechas vuelven a PagomovilBDV (o avisan al visor de flujo) */
    function volver(){
      if(window.parent !== window){ window.parent.postMessage({tipo:'bdv-volver'}, '*'); }
      else { location.href = 'pagomovil.html'; }
    }
    document.getElementById('cpFlecha').addEventListener('click', volver);
    document.getElementById('cpFlechaPie').addEventListener('click', volver);

    /* El icono de copiar copia el numero de operacion (como en la app) */
    document.getElementById('cpCopiar').addEventListener('click', function(){
      var numero = document.getElementById('cpVal2').textContent;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(numero)['catch'](function(){});
      }
    });

    /* Interruptores: al tocar, la bola se desliza (igual que en la app) */
    function interruptor(riel, bola){
      var encendido = false;
      var recorrido = 64 - 34.5;
      document.getElementById(riel).addEventListener('click', alternar);
      document.getElementById(bola).addEventListener('click', alternar);
      function alternar(){
        encendido = !encendido;
        document.getElementById(bola).style.transform = 'translateX(' + (encendido ? recorrido : 0) + 'px)';
      }
    }
    interruptor('cpTrack1', 'cpKnob1');
    interruptor('cpTrack2', 'cpKnob2');
  </script>

</body>
</html>
